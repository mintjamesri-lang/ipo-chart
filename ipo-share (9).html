<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO 수익률 대시보드 — Mint Investment</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap');
:root{
  --bg:#0b0f18;--surface:#111720;--surface2:#181f2e;--border:#1e2a3a;
  --mint:#00c896;--mint2:#00a87e;--mint-glow:rgba(0,200,150,.12);
  --blue:#3b82f6;--red:#ef4444;--orange:#f97316;--purple:#a78bfa;--gold:#f59e0b;
  --text:#f0f4f8;--text2:#b0bec5;--text3:#7890a0;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;padding:20px;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,200,150,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,150,.022) 1px,transparent 1px);background-size:44px 44px;pointer-events:none;}
.wrap{position:relative;max-width:1520px;margin:0 auto;}

/* 헤더 */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border);}
.brand-name{font-size:22px;font-weight:900;letter-spacing:-0.5px;}
.brand-name .m-mint{color:var(--mint);}
.brand-sub{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#7890a0;margin-top:3px;font-family:'JetBrains Mono',monospace;}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pill{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;border:1px solid;}

/* 공유 배너 */
.share-banner{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.share-info{flex:1;min-width:150px;}
.share-info .stitle{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
.share-info .sdesc{font-size:11px;color:#8fa8b8;}
.share-links{display:flex;flex-direction:column;gap:7px;flex:2;min-width:260px;}
.share-row{display:flex;gap:6px;align-items:center;}
.share-label{font-size:10px;font-family:monospace;font-weight:700;width:72px;flex-shrink:0;}
.share-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:11px;padding:6px 10px;outline:none;cursor:pointer;}

/* 세션바 */
.session-bar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.session-bar label{font-size:9px;color:#8fa8b8;font-family:monospace;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
.session-bar input[type=text],.session-bar input[type=date]{background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:6px 10px;outline:none;transition:border-color .2s;}
.session-bar input:focus{border-color:var(--mint);}

/* 메인 탭 (스팩/일반) */
.main-tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:2px solid var(--border);}
.main-tab{padding:10px 28px;font-size:14px;font-weight:700;color:#7890a0;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s;user-select:none;}
.main-tab:hover{color:var(--text2);}
.main-tab.active.normal{color:var(--mint);border-bottom-color:var(--mint);}
.main-tab.active.spac{color:var(--gold);border-bottom-color:var(--gold);}
.tab-count{font-size:10px;font-family:monospace;margin-left:6px;opacity:.9;}

/* 서브탭 (차트/데이터) */
.sub-tabs{display:flex;gap:8px;margin-bottom:14px;}
.sub-tab{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid var(--border);color:#8fa8b8;background:var(--surface2);transition:all .15s;user-select:none;}
.sub-tab.active{background:var(--surface);color:var(--text);border-color:var(--text3);}
.sub-tab.active.normal{color:var(--mint);border-color:var(--mint);}
.sub-tab.active.spac{color:var(--gold);border-color:var(--gold);}

/* 입력 패널 */
.input-panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px;}
.panel-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.panel-title.normal{color:var(--mint);}
.panel-title.spac{color:var(--gold);}
.col-heads{display:grid;grid-template-columns:1fr 82px 82px 66px 86px 86px 26px;gap:5px;padding:0 8px;margin-bottom:4px;}
.col-heads span{font-size:9px;color:#8fa8b8;text-align:center;font-family:monospace;text-transform:uppercase;letter-spacing:.3px;}
.col-heads span:first-child{text-align:left;}
.rows-container{display:flex;flex-direction:column;gap:3px;max-height:360px;overflow-y:auto;}
.data-row{display:grid;grid-template-columns:1fr 82px 82px 66px 86px 86px 26px;gap:5px;background:var(--surface2);border-radius:7px;padding:5px 8px;border:1px solid var(--border);align-items:center;transition:border-color .15s;}
.data-row:hover{border-color:var(--mint);}
.data-row.spac-row:hover{border-color:var(--gold);}
.data-row input{background:transparent;border:none;color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:12px;outline:none;width:100%;}
.data-row input[type=number]{text-align:center;}
.data-row input::placeholder{color:var(--text3);}
.del-btn{background:transparent;border:1px solid transparent;color:var(--red);font-size:15px;cursor:pointer;width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;}
.del-btn:hover{border-color:var(--red);background:rgba(239,68,68,.1);}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}

/* 버튼 */
.btn{padding:7px 15px;border-radius:8px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:12px;border:none;transition:all .15s;}
.btn-pri{background:var(--blue);color:white;}
.btn-sec{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.btn-sec:hover{border-color:var(--mint);color:var(--mint);}
.btn-mint{background:var(--mint);color:#0b0f18;font-weight:900;}
.btn-mint:hover{background:var(--mint2);}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

/* 붙여넣기 */
.paste-area{margin-top:10px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;}
.paste-area label{font-size:11px;color:#b0bec5;display:block;margin-bottom:5px;}
.paste-area textarea{width:100%;height:76px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;padding:7px 10px;resize:vertical;outline:none;}

/* 통계 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:12px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;}
.stat-card .slabel{font-size:9px;color:#8fa8b8;font-family:monospace;text-transform:uppercase;letter-spacing:.5px;}
.stat-card .sval{font-size:18px;font-weight:900;font-family:'JetBrains Mono',monospace;margin-top:2px;}
.stat-card .ssub{font-size:10px;color:#8fa8b8;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 범례 */
.legend{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:9px 14px;display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;}
.leg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);cursor:pointer;user-select:none;transition:opacity .2s;}
.leg-item.off{opacity:.28;}
.leg-dot{width:9px;height:9px;border-radius:50%;border:2px solid;flex-shrink:0;}

/* 차트 */
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;position:relative;overflow:hidden;margin-bottom:14px;}
.chart-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.chart-card.normal::before{background:linear-gradient(90deg,var(--mint),var(--blue),var(--purple));}
.chart-card.spac::before{background:linear-gradient(90deg,var(--gold),var(--orange),var(--red));}
.chart-title{font-size:10px;font-weight:700;color:#a0b4c0;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}

/* 읽기전용 배지 */
.readonly-badge{display:inline-flex;align-items:center;gap:6px;background:var(--mint-glow);border:1px solid var(--mint);color:var(--mint);border-radius:8px;padding:5px 12px;font-size:12px;font-weight:700;}

/* 토스트 */
#toast{position:fixed;top:18px;right:18px;z-index:9999;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,.5);display:none;max-width:340px;border:1px solid;}

/* 로딩 */
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:1000;}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--mint);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>

<div id="loadingScreen">

</div>

  {name:'메리츠제1호스팩',   open:150,high:160,time:'9:00',existing:0,nonEx:107},
  {name:'IBKS제25호스팩',    open:142,high:225,time:'9:07',existing:0,nonEx:56},
  {name:'미래에셋비전스팩11호',open:95,high:148,time:'9:07',existing:0,nonEx:69},
  {name:'하나스팩36호',      open:50, high:65, time:'9:02',existing:0,nonEx:82},

  {name:'키움히어로제2호스팩',open:140,high:277,time:'12:46',existing:0,nonEx:120},

function blankRow(){return {name:'',open:'',high:'',time:'9:00',existing:'',nonEx:''};}
function currentRows(){return data[mainTab];}

// ══════════════════════════════════════════
//  초기화
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  const params  = new URLSearchParams(location.search);
  const isView  = params.get('view') === '1';
  isReadonly = isView;
  if (isView) setViewMode(); else setEditMode();
  await loadFromBin(FIXED_BIN_ID);
  hideLoading();
});

// ══════════════════════════════════════════
//  저장 / 불러오기
// ══════════════════════════════════════════
async function saveData() {
  const normalValid = data.normal.filter(r=>r.name&&r.name.trim());
  const spacValid   = data.spac.filter(r=>r.name&&r.name.trim());
  if (!normalValid.length && !spacValid.length) return toast('저장할 데이터가 없습니다','error');
  const btn = document.getElementById('saveBtn');
  btn.disabled=true; btn.textContent='저장 중...';
  const payload = {
    sessionName: document.getElementById('sessionName').value || 'IPO Chart',
    sessionDate: document.getElementById('sessionDate').value || today(),
    savedAt: new Date().toISOString(),
    normal: normalValid,
    spac:   spacValid,
  };
  try {
    const headers={'Content-Type':'application/json','X-Bin-Private':'false','X-Master-Key':MASTER_KEY};
    const res  = await fetch(JSONBIN_API+'/'+FIXED_BIN_ID,{method:'PUT',headers,body:JSON.stringify(payload)});
    const resp = await res.json();
    if (!res.ok) throw new Error(resp.message||res.status);
    updateTabCounts();
    toast('✅ 저장 완료! 모든 사람에게 반영됐어요','success');
  } catch(e){ toast('저장 실패: '+e.message,'error'); }
  btn.disabled=false; btn.textContent='💾 저장 (전체 공유)';
}

async function loadFromBin(binId) {
  try {
    const res  = await fetch(JSONBIN_API+'/'+binId+'/latest',{'headers':{'X-Bin-Meta':'false','X-Master-Key':MASTER_KEY}});
    const d    = await res.json();
    if (!res.ok) throw new Error(d.message||'불러오기 실패');
    data.normal = d.normal || SAMPLE_NORMAL.map(r=>({...r}));
    data.spac   = d.spac   || SAMPLE_SPAC.map(r=>({...r}));
    if (d.sessionName) document.getElementById('sessionName').value = d.sessionName;
    if (d.sessionDate) document.getElementById('sessionDate').value = d.sessionDate;
    updateTabCounts();
    renderRows(); buildChart(); updateStats();
    if (!isReadonly) toast('최신 데이터 불러옴!','success');
  } catch(e){
    data.normal = SAMPLE_NORMAL.map(r=>({...r}));
    data.spac   = SAMPLE_SPAC.map(r=>({...r}));
    updateTabCounts(); renderRows(); buildChart(); updateStats();
  }
}

// ══════════════════════════════════════════
//  모드
// ══════════════════════════════════════════
function setEditMode(){
  document.getElementById('sessionBar').style.display='';
  document.getElementById('editBtnRow').style.display='';
  document.getElementById('sessionDate').value=today();
  document.getElementById('app').style.display='';
}
function setViewMode(){
  document.getElementById('sessionBar').style.display='none';
  document.getElementById('shareBanner').style.display='none';
  document.getElementById('readonlyBadge').style.display='';
  // 서브탭 데이터 입력 숨기기
  document.getElementById('subtab-data').style.display='none';
  document.getElementById('app').style.display='';
}
function hideLoading(){document.getElementById('loadingScreen').style.display='none';}

// ══════════════════════════════════════════
//  탭 전환
// ══════════════════════════════════════════
function switchMain(tab) {
  mainTab = tab;
  ['normal','spac'].forEach(t=>{
    document.getElementById('tab-'+t).className='main-tab '+(t===tab?'active ':'')+t;
  });
  // 서브탭 색상
  updateSubTabColor();
  renderRows(); buildChart(); updateStats();
}

function switchSub(tab) {
  subTab = tab;
  document.getElementById('section-chart').style.display = tab==='chart' ? '' : 'none';
  document.getElementById('section-data').style.display  = tab==='data'  ? '' : 'none';
  ['chart','data'].forEach(t=>{
    const el = document.getElementById('subtab-'+t);
    el.className='sub-tab'+(t===tab?' active ':' ')+mainTab;
  });
  if (tab==='chart') buildChart();
}

function updateSubTabColor(){
  ['chart','data'].forEach(t=>{
    const el=document.getElementById('subtab-'+t);
    el.className=el.className.replace(' normal','').replace(' spac','');
    if(el.classList.contains('active')) el.classList.add(mainTab);
  });
  const cc=document.getElementById('mainChartCard');
  cc.className='chart-card '+mainTab;
  const pt=document.getElementById('panelTitle');
  pt.className='panel-title '+mainTab;
}

function updateTabCounts(){
  document.getElementById('cnt-normal').textContent='('+data.normal.filter(r=>r.name).length+')';
  document.getElementById('cnt-spac').textContent='('+data.spac.filter(r=>r.name).length+')';
}

// ══════════════════════════════════════════
//  행 렌더링
// ══════════════════════════════════════════
function renderRows(){
  const c=document.getElementById('rowsContainer');
  c.innerHTML='';
  const rows=currentRows();
  rows.forEach((r,i)=>{
    const div=document.createElement('div');
    div.className='data-row'+(mainTab==='spac'?' spac-row':'');
    if(isReadonly){
      div.innerHTML=
        '<span style="font-size:12px">'+r.name+'</span>'+
        '<span style="font-size:12px;text-align:center">'+r.open+'%</span>'+
        '<span style="font-size:12px;text-align:center;color:#ef4444">'+r.high+'%</span>'+
        '<span style="font-size:12px;text-align:center;color:#a78bfa">'+r.time+'</span>'+
        '<span style="font-size:12px;text-align:center;color:#00c896">'+r.existing+'</span>'+
        '<span style="font-size:12px;text-align:center;color:#fb923c">'+r.nonEx+'</span>'+
        '<span></span>';
    } else {
      div.innerHTML=
        '<input type="text"   placeholder="종목명" value="'+(r.name||'')+'"     oninput="data[mainTab]['+i+'].name=this.value">'+
        '<input type="number" placeholder="0"      value="'+(r.open||'')+'"     oninput="data[mainTab]['+i+'].open=this.value" step="0.1">'+
        '<input type="number" placeholder="0"      value="'+(r.high||'')+'"     oninput="data[mainTab]['+i+'].high=this.value" step="0.1">'+
        '<input type="text"   placeholder="9:00"   value="'+(r.time||'')+'"     oninput="data[mainTab]['+i+'].time=this.value">'+
        '<input type="number" placeholder="0"      value="'+(r.existing||'')+'" oninput="data[mainTab]['+i+'].existing=this.value" style="color:#00c896">'+
        '<input type="number" placeholder="0"      value="'+(r.nonEx||'')+'"    oninput="data[mainTab]['+i+'].nonEx=this.value" style="color:#fb923c">'+
        '<button class="del-btn" onclick="removeRow('+i+')">x</button>';
    }
    c.appendChild(div);
  });
}

function addRow(){data[mainTab].push(blankRow());renderRows();}
function removeRow(i){data[mainTab].splice(i,1);renderRows();}
function clearCurrent(){data[mainTab]=[blankRow()];renderRows();buildChart();updateStats();updateTabCounts();}

function togglePaste(){
  const el=document.getElementById('pasteArea');
  el.style.display=el.style.display==='none'?'':'none';
}
function parsePaste(){
  const text=document.getElementById('pasteText').value.trim();
  if(!text) return toast('붙여넣기 영역이 비어있습니다','error');
  const parsed=text.split('\n').filter(l=>l.trim()).map(line=>{
    const c=line.split('\t').map(x=>x.trim().replace(/%/g,'').replace(/,/g,''));
    return {name:c[0]||'',open:c[1]||'',high:c[2]||'',time:c[3]||'9:00',existing:c[4]||'',nonEx:c[5]||''};
  }).filter(r=>r.name);
  if(!parsed.length) return toast('파싱 실패','error');
  data[mainTab]=parsed;
  renderRows();buildChart();updateStats();updateTabCounts();
  document.getElementById('pasteText').value='';
  togglePaste();
  toast(parsed.length+'개 종목 불러옴','success');
}

// ══════════════════════════════════════════
//  차트
// ══════════════════════════════════════════
function timeToMin(t){
  if(!t) return null;
  const p=t.trim().split(':').map(Number);
  if(p.length<2||isNaN(p[0])||isNaN(p[1])) return null;
  return (p[0]-9)*60+p[1];
}
function minToTime(v){
  if(v==null) return '-';
  return (9+Math.floor(v/60))+':'+String(v%60).padStart(2,'0');
}
function toggleVis(key){
  vis[key]=!vis[key];
  document.getElementById('leg-'+key).classList.toggle('off',!vis[key]);
  buildChart();
}

function buildChart(){
  const rows=currentRows().filter(r=>r.name);
  const labels=rows.map(r=>r.name);
  const isSpac=mainTab==='spac';
  const tip={backgroundColor:'#181f2e',titleColor:'#f0f4f8',bodyColor:'#8899aa',borderColor:'#1e2a3a',borderWidth:1,padding:10,cornerRadius:8,
    callbacks:{label:ctx=>{
      const v=ctx.parsed.y, l=ctx.dataset.label||'';
      if(ctx.dataset.yAxisID==='yTime') return l+': '+minToTime(v);
      if(ctx.dataset.yAxisID==='yBar')  return l+': '+(v?v.toLocaleString()+'억':'-');
      return l+': '+v+'%';
    }}
  };

  const datasets=[];
  const barColor1 = isSpac ? 'rgba(245,158,11,.55)' : 'rgba(0,200,150,.55)';
  const barColor2 = isSpac ? 'rgba(249,115,22,.55)' : 'rgba(249,115,22,.55)';

  if(vis.existing) datasets.push({type:'bar',label:'기존주주 유통가능금액',data:rows.map(r=>parseFloat(r.existing)||0),backgroundColor:barColor1,borderRadius:3,barThickness:8,yAxisID:'yBar',order:4});
  if(vis.nonex)    datasets.push({type:'bar',label:'기존주주 제외 유통가능금액',data:rows.map(r=>parseFloat(r.nonEx)||0),backgroundColor:barColor2,borderRadius:3,barThickness:8,yAxisID:'yBar',order:5});

  const lineColor = isSpac ? '#f59e0b' : '#3b82f6';
  const highColor = isSpac ? '#f97316' : '#ef4444';

  if(vis.open) datasets.push({type:'line',label:'시가수익률',data:rows.map(r=>parseFloat(r.open)||0),borderColor:lineColor,pointBackgroundColor:lineColor,tension:.3,pointRadius:4,pointHoverRadius:7,yAxisID:'yPct',fill:false,borderWidth:2,order:2});
  if(vis.high) datasets.push({type:'line',label:'고가수익률',data:rows.map(r=>parseFloat(r.high)||0),borderColor:highColor,pointBackgroundColor:highColor,tension:.3,pointRadius:4,pointHoverRadius:7,yAxisID:'yPct',fill:false,borderWidth:2,order:1});
  if(vis.time) datasets.push({type:'line',label:'고가형성시간',data:rows.map(r=>timeToMin(r.time)),borderColor:'#a78bfa',pointBackgroundColor:'#a78bfa',tension:.3,pointRadius:4,pointHoverRadius:7,yAxisID:'yTime',fill:false,borderWidth:2,order:0});

  if(comboChart) comboChart.destroy();
  comboChart=new Chart(document.getElementById('comboChart'),{
    type:'bar', data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{legend:{display:false},tooltip:tip},
      scales:{
        x:{grid:{color:'rgba(255,255,255,.03)'},ticks:{color:'#8fa8b8',font:{family:"'Noto Sans KR'",size:9},maxRotation:45}},
        yPct:{position:'left',grid:{color:'rgba(255,255,255,.04)'},ticks:{color:'#c0cdd8',font:{family:"'JetBrains Mono'",size:9},callback:v=>v+'%'}},
        yTime:{position:'right',grid:{display:false},ticks:{color:'#c4b5fd',font:{family:"'JetBrains Mono'",size:9},callback:v=>minToTime(v)}},
        yBar:{display:false}
      }
    },
    plugins:[{
      id:'barLabels',
      afterDatasetsDraw(chart){
        const ctx2=chart.ctx;
        const positions=[];
        chart.data.datasets.forEach((ds,di)=>{
          if(ds.type!=='bar') return;
          chart.getDatasetMeta(di).data.forEach((bar,i)=>{
            const v=ds.data[i];
            if(!v||v<10) return;
            if(bar.base-bar.y<12) return;
            const x=bar.x, y=bar.y-3;
            if(positions.some(p=>Math.abs(p.x-x)<20&&Math.abs(p.y-y)<12)) return;
            positions.push({x,y});
            const label=v>=1000?(v/1000).toFixed(1)+'k억':v+'억';
            ctx2.save();
            ctx2.font='bold 9px "JetBrains Mono",monospace';
            ctx2.fillStyle='rgba(255,255,255,0.82)';
            ctx2.textAlign='center';
            ctx2.textBaseline='bottom';
            ctx2.fillText(label,x,y);
            ctx2.restore();
          });
        });
      }
    }]
  });
}

// ══════════════════════════════════════════
//  통계
// ══════════════════════════════════════════
function updateStats(){
  const rows=currentRows().filter(r=>r.name);
  const grid=document.getElementById('statsGrid');
  if(!rows.length){grid.innerHTML='';return;}
  const maxHigh=rows.reduce((a,b)=>parseFloat(a.high)>parseFloat(b.high)?a:b);
  const maxOpen=rows.reduce((a,b)=>parseFloat(a.open)>parseFloat(b.open)?a:b);
  const avgHigh=(rows.reduce((s,r)=>s+(parseFloat(r.high)||0),0)/rows.length).toFixed(1);
  const avgOpen=(rows.reduce((s,r)=>s+(parseFloat(r.open)||0),0)/rows.length).toFixed(1);
  const hit300=rows.filter(r=>parseFloat(r.high)>=299.9).length;
  const c=mainTab==='spac'?'#f59e0b':'#00c896';
  grid.innerHTML=[
    {l:'종목 수',          v:rows.length,       cl:c},
    {l:'최고 고가수익률',  v:maxHigh.high+'%',  cl:'#ef4444',s:maxHigh.name},
    {l:'최고 시가수익률',  v:maxOpen.open+'%',  cl:'#3b82f6',s:maxOpen.name},
    {l:'평균 고가수익률',  v:avgHigh+'%',       cl:'#ef4444'},
    {l:'평균 시가수익률',  v:avgOpen+'%',       cl:'#3b82f6'},
    {l:'상한가(300%) 도달',v:hit300+'종목',     cl:c},
  ].map(d=>'<div class="stat-card"><div class="slabel">'+d.l+'</div><div class="sval" style="color:'+d.cl+'">'+d.v+'</div>'+(d.s?'<div class="ssub">'+d.s+'</div>':'')+'</div>').join('');
}

// ══════════════════════════════════════════
//  공유 링크 복사
// ══════════════════════════════════════════
function copyUrl(type){
  const id=type==='view'?'viewUrlInput':'editUrlInput';
  const input=document.getElementById(id);
  input.select();
  navigator.clipboard.writeText(input.value)
    .then(()=>toast(type==='view'?'👁 읽기전용 링크 복사됨!':'✏️ 편집용 링크 복사됨!','success'))
    .catch(()=>{document.execCommand('copy');toast('복사 완료!','success');});
}

// ══════════════════════════════════════════
//  유틸
// ══════════════════════════════════════════
function today(){return new Date().toISOString().slice(0,10);}
function toast(msg,type){
  const el=document.getElementById('toast');
  el.textContent=msg;el.style.display='block';
  el.style.background=type==='error'?'#7f1d1d':'#064e3b';
  el.style.borderColor=type==='error'?'#dc2626':'#00c896';
  el.style.color='#f0f4f8';
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>{el.style.display='none';},3500);
}
</script>
