<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPO 수익률 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0e1a;
  --surface: #111827;
  --surface2: #1a2235;
  --border: #1e2d45;
  --blue: #3b82f6;
  --red: #ef4444;
  --gold: #f59e0b;
  --green: #10b981;
  --orange: #f97316;
  --purple: #a78bfa;
  --text: #f1f5f9;
  --text2: #94a3b8;
  --text3: #475569;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  padding: 20px;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(59,130,246,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
}

.wrap { position: relative; max-width: 1500px; margin: 0 auto; }

/* ── 헤더 ── */
header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  margin-bottom: 20px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
h1 {
  font-size: 21px; font-weight: 900; letter-spacing: -.5px;
  background: linear-gradient(135deg,#f1f5f9 0%,#3b82f6 55%,#8b5cf6 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.subtitle { font-size: 11px; color: var(--text3); margin-top: 3px; font-family: 'JetBrains Mono', monospace; }

/* ── 공유 배너 ── */
.share-banner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 16px;
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
}
.share-banner.readonly {
  border-color: var(--purple);
  background: rgba(167,139,250,.06);
}
.share-info { flex: 1; min-width: 200px; }
.share-info .stitle { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.share-info .sdesc { font-size: 11px; color: var(--text3); }
.share-url-box {
  display: flex; gap: 6px; align-items: center; flex: 2; min-width: 280px;
}
.share-url-box input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--blue); font-family: 'JetBrains Mono', monospace;
  font-size: 11px; padding: 8px 12px; outline: none; cursor: pointer;
}
.share-url-box input:focus { border-color: var(--blue); }

/* ── 세션명 입력 ── */
.session-bar {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  margin-bottom: 16px;
}
.session-bar label { font-size: 10px; color: var(--text3); font-family: monospace; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 4px; }
.session-bar input[type=text], .session-bar input[type=date] {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text);
  font-family: 'Noto Sans KR', sans-serif; font-size: 13px;
  padding: 7px 11px; outline: none; transition: border-color .2s;
}
.session-bar input:focus { border-color: var(--blue); }
.session-bar input[type=date] { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

/* ── 입력 패널 ── */
.input-panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; margin-bottom: 16px;
}
.panel-title {
  font-size: 11px; font-weight: 700; color: var(--blue);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;
}
.col-heads {
  display: grid;
  grid-template-columns: 1fr 86px 86px 68px 88px 88px 28px;
  gap: 5px; padding: 0 8px; margin-bottom: 5px;
}
.col-heads span {
  font-size: 9px; color: var(--text3); text-align: center;
  font-family: monospace; text-transform: uppercase; letter-spacing: .3px;
}
.col-heads span:first-child { text-align: left; }
.rows-container { display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
.data-row {
  display: grid;
  grid-template-columns: 1fr 86px 86px 68px 88px 88px 28px;
  gap: 5px; background: var(--surface2); border-radius: 8px;
  padding: 6px 8px; border: 1px solid var(--border);
  align-items: center; transition: border-color .2s;
}
.data-row:hover { border-color: var(--blue); }
.data-row input {
  background: transparent; border: none;
  color: var(--text); font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px; outline: none; width: 100%;
}
.data-row input[type=number] { text-align: center; }
.data-row input::placeholder { color: var(--text3); }
.del-btn {
  background: transparent; border: 1px solid transparent;
  color: var(--red); font-size: 16px; cursor: pointer;
  width: 24px; height: 24px; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  transition: all .15s;
}
.del-btn:hover { border-color: var(--red); background: rgba(239,68,68,.1); }
.btn-row { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }

/* ── 버튼 ── */
.btn {
  padding: 8px 16px; border-radius: 8px; cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif; font-weight: 700;
  font-size: 12px; border: none; transition: all .18s;
}
.btn-pri { background: var(--blue); color: white; }
.btn-pri:hover { background: #2563eb; box-shadow: 0 0 12px rgba(59,130,246,.4); }
.btn-sec { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
.btn-sec:hover { border-color: var(--blue); color: var(--blue); }
.btn-green { background: #065f46; color: #34d399; border: 1px solid #10b981; }
.btn-green:hover { background: #047857; }
.btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
.btn-danger:hover { background: rgba(239,68,68,.1); }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ── 붙여넣기 ── */
.paste-area {
  margin-top: 12px; padding: 12px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
}
.paste-area label { font-size: 11px; color: var(--text2); display: block; margin-bottom: 6px; }
.paste-area textarea {
  width: 100%; height: 80px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 7px;
  color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 11px; padding: 8px 10px; resize: vertical; outline: none;
}
.paste-area textarea:focus { border-color: var(--blue); }

/* ── 통계 ── */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(130px,1fr));
  gap: 8px; margin-bottom: 14px;
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 11px 13px;
}
.stat-card .slabel { font-size: 9px; color: var(--text3); font-family: monospace; text-transform: uppercase; letter-spacing: .5px; }
.stat-card .sval { font-size: 19px; font-weight: 900; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
.stat-card .ssub { font-size: 10px; color: var(--text3); margin-top: 1px; }

/* ── 범례 ── */
.legend {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 14px;
  display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 14px;
}
.leg-item {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text2); cursor: pointer;
  user-select: none; transition: opacity .2s;
}
.leg-item.off { opacity: .3; }
.leg-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex-shrink: 0; }

/* ── 차트 ── */
.chart-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; margin-bottom: 14px;
  position: relative; overflow: hidden;
}
.chart-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, var(--blue), var(--red), var(--purple));
}
.chart-title { font-size: 11px; font-weight: 700; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
.chart-wrap { height: 280px; }

/* ── 토스트 ── */
#toast {
  position: fixed; top: 18px; right: 18px; z-index: 9999;
  padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,.5); display: none; max-width: 360px;
  border: 1px solid; animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity:0; transform:translateY(-8px); } to { opacity:1; transform:translateY(0); } }

/* ── 오버레이 (읽기전용 배지) ── */
.readonly-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: rgba(167,139,250,.15); border: 1px solid var(--purple);
  color: var(--purple); border-radius: 8px; padding: 5px 12px;
  font-size: 12px; font-weight: 700;
}

/* ── 로딩 ── */
#loadingScreen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 1000;
}
.spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--blue); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 스크롤바 ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--surface); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<!-- 로딩 -->
<div id="loadingScreen">
  <div class="spinner"></div>
  <div style="font-size:13px;color:var(--text3);font-family:monospace">데이터 불러오는 중...</div>
</div>

<!-- 토스트 -->
<div id="toast"></div>

<div class="wrap" id="app" style="display:none">

  <!-- 헤더 -->
  <header>
    <div>
      <h1>📈 IPO 상장 당일 수익률 대시보드</h1>
      <p class="subtitle">시가수익률 · 고가수익률 · 고가형성시간 · 유통가능금액 분석</p>
    </div>
    <div id="readonlyBadge" style="display:none">
      <span class="readonly-badge">👁 읽기 전용 공유 뷰</span>
    </div>
  </header>

  <!-- 공유 배너 -->
  <div class="share-banner" id="shareBanner">
    <div class="share-info">
      <div class="stitle" id="shareBannerTitle">📤 공유 링크</div>
      <div class="sdesc" id="shareBannerDesc">저장 후 이 링크를 공유하면 해당 링크를 가진 사람만 볼 수 있어요</div>
    </div>
    <div class="share-url-box" id="shareUrlBox" style="display:none">
      <input type="text" id="shareUrlInput" readonly onclick="this.select()" />
      <button class="btn btn-sec" onclick="copyUrl()">📋 복사</button>
    </div>
  </div>

  <!-- 세션 정보 (편집모드만) -->
  <div class="session-bar" id="sessionBar">
    <div>
      <label>세션 이름</label>
      <input type="text" id="sessionName" placeholder="예: 2025-01-15 상장 종목" style="width:220px">
    </div>
    <div>
      <label>날짜</label>
      <input type="date" id="sessionDate">
    </div>
    <button class="btn btn-green" id="saveBtn" onclick="saveData()" style="margin-top:18px">
      💾 저장 & 공유링크 생성
    </button>
    <button class="btn btn-sec" onclick="newSession()" style="margin-top:18px">+ 새로 만들기</button>
  </div>

  <!-- 데이터 입력 (편집모드만) -->
  <div class="input-panel" id="inputPanel">
    <div class="panel-title">📊 데이터 입력</div>
    <div class="col-heads">
      <span>종목명</span>
      <span>시가수익률%</span>
      <span>고가수익률%</span>
      <span>고가형성</span>
      <span style="color:#10b981">기존주주유통</span>
      <span style="color:#f97316">제외유통</span>
      <span></span>
    </div>
    <div class="rows-container" id="rowsContainer"></div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="addRow()">+ 행 추가</button>
      <button class="btn btn-pri" onclick="refreshCharts()">🔄 차트 업데이트</button>
      <button class="btn btn-sec" onclick="loadSample()">📋 샘플 데이터</button>
      <button class="btn btn-sec" onclick="togglePaste()">⚡ 붙여넣기</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑 초기화</button>
    </div>
    <div class="paste-area" id="pasteArea" style="display:none">
      <label>구글시트에서 복사 후 붙여넣기 (탭 구분: 종목명 · 시가% · 고가% · 고가형성 · 기존주주유통 · 제외유통)</label>
      <textarea id="pasteText" placeholder="여기에 붙여넣으세요..."></textarea>
      <div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn btn-pri" onclick="parsePaste()">📥 불러오기</button>
        <button class="btn btn-sec" onclick="togglePaste()">취소</button>
      </div>
    </div>
  </div>

  <!-- 통계 -->
  <div class="stats-grid" id="statsGrid"></div>

  <!-- 범례 -->
  <div class="legend" id="legend">
    <div class="leg-item" id="leg-open" onclick="toggle('open')">
      <div class="leg-dot" style="border-color:#3b82f6;background:rgba(59,130,246,.25)"></div>시가수익률
    </div>
    <div class="leg-item" id="leg-high" onclick="toggle('high')">
      <div class="leg-dot" style="border-color:#ef4444;background:rgba(239,68,68,.25)"></div>고가수익률
    </div>
    <div class="leg-item" id="leg-time" onclick="toggle('time')">
      <div class="leg-dot" style="border-color:#a78bfa;background:rgba(167,139,250,.25)"></div>고가형성시간
    </div>
    <div class="leg-item" id="leg-existing" onclick="toggle('existing')">
      <div class="leg-dot" style="border-color:#10b981;background:rgba(16,185,129,.25)"></div>기존주주 유통가능금액
    </div>
    <div class="leg-item" id="leg-nonex" onclick="toggle('nonex')">
      <div class="leg-dot" style="border-color:#f97316;background:rgba(249,115,22,.25)"></div>기존주주 제외 유통가능금액
    </div>
  </div>

  <!-- 차트 -->
  <div class="chart-card">
    <div class="chart-title">수익률 & 고가형성시간</div>
    <div class="chart-wrap"><canvas id="lineChart"></canvas></div>
  </div>
  <div class="chart-card">
    <div class="chart-title">유통가능금액 (억원)</div>
    <div class="chart-wrap"><canvas id="barChart"></canvas></div>
  </div>

</div>

<script>
// ════════════════════════════════════════════
//  설정 — jsonbin.io 무료 API 사용
//  API 키가 없어도 public bin 생성 가능
//  (하루 10,000 요청 무료)
// ════════════════════════════════════════════
const JSONBIN_API = 'https://api.jsonbin.io/v3/b';
// ※ 아래 Master Key는 jsonbin.io 가입 후 발급 (무료)
//   없어도 public bin으로 저장 가능하지만 Key 있으면 private 설정 가능
const MASTER_KEY  = '';  // 선택사항: '$2a$10$...' 형태

// ════════════════════════════════════════════
//  상태
// ════════════════════════════════════════════
let rows = [];
let lineChart = null, barChart = null;
let vis = { open:true, high:true, time:true, existing:true, nonex:true };
let isReadonly = false;
let currentBinId = null;

const SAMPLE = [
  {name:'더핑크퐁컴퍼니', open:52.6,  high:61.8,  time:'9:01',  existing:281,  nonEx:101  },
  {name:'씨엠티엑스',      open:151.2, high:154.5, time:'9:00',  existing:164,  nonEx:116  },
  {name:'비츠로넥스텍',    open:81.2,  high:197.1, time:'9:20',  existing:437,  nonEx:114  },
  {name:'아로마티카',      open:243.8, high:293.8, time:'9:00',  existing:29,   nonEx:222  },
  {name:'에임드바이오',    open:300.0, high:300.0, time:'9:00',  existing:143,  nonEx:133  },
  {name:'테라뷰',          open:50.0,  high:100.0, time:'15:30', existing:332,  nonEx:234  },
  {name:'페스카로',        open:190.3, high:203.2, time:'9:00',  existing:628,  nonEx:176  },
  {name:'이지스',          open:113.3, high:122.0, time:'9:08',  existing:131,  nonEx:64   },
  {name:'쿼드메디슨',      open:59.7,  high:59.7,  time:'9:24',  existing:3080, nonEx:909  },
  {name:'티엠씨',          open:142.5, high:146.2, time:'9:00',  existing:1694, nonEx:1296 },
  {name:'아크릴',          open:135.4, high:294.9, time:'13:04', existing:261,  nonEx:2535 },
  {name:'나라스페이스테크놀로지', open:106.1, high:201.2, time:'9:37', existing:8256, nonEx:3045},
  {name:'알지노믹스',      open:300.0, high:300.0, time:'9:00',  existing:90,   nonEx:74   },
  {name:'삼진식품',        open:201.3, high:236.8, time:'9:05',  existing:103,  nonEx:58   },
  {name:'리브스메드',      open:20.0,  high:29.1,  time:'13:28', existing:662,  nonEx:113  },
  {name:'세미파이브',      open:73.8,  high:75.8,  time:'9:01',  existing:396,  nonEx:144  },
  {name:'덕양에너젠',      open:110.5, high:295.0, time:'12:18', existing:426,  nonEx:79   },
  {name:'케이뱅크',        open:8.4,   high:19.0,  time:'9:00',  existing:401,  nonEx:80   },
  {name:'액스비스',        open:300.0, high:300.0, time:'9:00',  existing:224,  nonEx:154  },
  {name:'카나프테라퓨틱스',open:240.5, high:250.0, time:'12:47', existing:204,  nonEx:81   },
];

// ════════════════════════════════════════════
//  초기화 — URL에 ?id=xxx 있으면 불러오기
// ════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(location.search);
  const binId  = params.get('id');

  if (binId) {
    // 공유 링크로 접근 → 읽기 전용
    await loadFromBin(binId);
  } else {
    // 직접 접근 → 편집 모드
    setEditMode();
    loadSample();
    hideLoading();
  }
});

// ════════════════════════════════════════════
//  jsonbin.io — 저장 (새 bin 생성)
// ════════════════════════════════════════════
async function saveData() {
  const valid = rows.filter(r => r.name.trim());
  if (!valid.length) return toast('저장할 데이터가 없습니다', 'error');

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  btn.textContent = '저장 중...';

  const payload = {
    sessionName: document.getElementById('sessionName').value || '무제 세션',
    sessionDate: document.getElementById('sessionDate').value || today(),
    savedAt: new Date().toISOString(),
    rows: valid,
  };

  try {
    const headers = {
      'Content-Type': 'application/json',
      'X-Bin-Name': payload.sessionName,
      'X-Bin-Private': 'false',   // public — 링크만 알면 접근 가능
    };
    if (MASTER_KEY) headers['X-Master-Key'] = MASTER_KEY;

    const res  = await fetch(JSONBIN_API, { method:'POST', headers, body: JSON.stringify(payload) });
    const data = await res.json();

    if (!res.ok) throw new Error(data.message || '저장 실패');

    const id      = data.metadata.id;
    const shareUrl = makeUrl(id);

    currentBinId = id;
    showShareUrl(shareUrl);
    toast('✅ 저장 완료! 링크를 복사해서 공유하세요', 'success');

  } catch(e) {
    toast('저장 실패: ' + e.message, 'error');
  }

  btn.disabled = false;
  btn.textContent = '💾 저장 & 공유링크 생성';
}

// ════════════════════════════════════════════
//  jsonbin.io — 불러오기 (공유 링크)
// ════════════════════════════════════════════
async function loadFromBin(binId) {
  try {
    const headers = { 'X-Bin-Meta': 'false' };
    if (MASTER_KEY) headers['X-Master-Key'] = MASTER_KEY;

    const res  = await fetch(`${JSONBIN_API}/${binId}/latest`, { headers });
    const data = await res.json();
    if (!res.ok) throw new Error(data.message || '불러오기 실패');

    rows = data.rows || [];
    setReadonlyMode(data);
    renderRows();
    refreshCharts();
    updateStats();
    showShareUrl(makeUrl(binId));
    toast(`📂 "${data.sessionName}" 불러옴 (${data.sessionDate})`, 'success');

  } catch(e) {
    toast('데이터 로드 실패: ' + e.message, 'error');
    setEditMode();
    loadSample();
  }
  hideLoading();
}

// ════════════════════════════════════════════
//  모드 설정
// ════════════════════════════════════════════
function setReadonlyMode(data) {
  isReadonly = true;
  document.getElementById('sessionBar').style.display   = 'none';
  document.getElementById('inputPanel').style.display   = 'none';
  document.getElementById('readonlyBadge').style.display = '';
  document.getElementById('shareBanner').classList.add('readonly');
  document.getElementById('shareBannerTitle').textContent = `📂 ${data.sessionName}`;
  document.getElementById('shareBannerDesc').textContent  =
    `${data.sessionDate} · ${data.rows?.length}종목 · 저장: ${new Date(data.savedAt).toLocaleString('ko-KR')}`;
  document.getElementById('app').style.display = '';
}

function setEditMode() {
  isReadonly = false;
  document.getElementById('sessionDate').value = today();
  document.getElementById('app').style.display = '';
}

function hideLoading() {
  document.getElementById('loadingScreen').style.display = 'none';
}

function newSession() {
  rows = [blankRow()];
  currentBinId = null;
  document.getElementById('sessionName').value = '';
  document.getElementById('sessionDate').value = today();
  document.getElementById('shareUrlBox').style.display = 'none';
  document.getElementById('shareBannerDesc').textContent = '저장 후 이 링크를 공유하면 해당 링크를 가진 사람만 볼 수 있어요';
  renderRows();
  refreshCharts();
  updateStats();
}

// ════════════════════════════════════════════
//  공유 URL
// ════════════════════════════════════════════
function makeUrl(binId) {
  return `${location.origin}${location.pathname}?id=${binId}`;
}

function showShareUrl(url) {
  const box = document.getElementById('shareUrlBox');
  document.getElementById('shareUrlInput').value = url;
  box.style.display = 'flex';
}

function copyUrl() {
  const input = document.getElementById('shareUrlInput');
  input.select();
  navigator.clipboard.writeText(input.value)
    .then(() => toast('🔗 링크가 클립보드에 복사됐어요!', 'success'))
    .catch(() => { document.execCommand('copy'); toast('🔗 복사 완료!', 'success'); });
}

// ════════════════════════════════════════════
//  행 관리
// ════════════════════════════════════════════
function blankRow() { return { name:'', open:'', high:'', time:'9:00', existing:'', nonEx:'' }; }

function renderRows() {
  const c = document.getElementById('rowsContainer');
  c.innerHTML = '';
  rows.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'data-row';
    if (isReadonly) {
      div.innerHTML = `
        <span style="font-size:12px;color:var(--text)">${r.name}</span>
        <span style="font-size:12px;text-align:center;color:var(--text)">${r.open}%</span>
        <span style="font-size:12px;text-align:center;color:#ef4444">${r.high}%</span>
        <span style="font-size:12px;text-align:center;color:var(--purple)">${r.time}</span>
        <span style="font-size:12px;text-align:center;color:#34d399">${r.existing}</span>
        <span style="font-size:12px;text-align:center;color:#fb923c">${r.nonEx}</span>
        <span></span>
      `;
    } else {
      div.innerHTML = `
        <input type="text"   placeholder="종목명" value="${r.name}"     oninput="rows[${i}].name=this.value">
        <input type="number" placeholder="0"      value="${r.open}"     oninput="rows[${i}].open=this.value"     step="0.1">
        <input type="number" placeholder="0"      value="${r.high}"     oninput="rows[${i}].high=this.value"     step="0.1">
        <input type="text"   placeholder="9:00"   value="${r.time}"     oninput="rows[${i}].time=this.value">
        <input type="number" placeholder="0"      value="${r.existing}" oninput="rows[${i}].existing=this.value" style="color:#34d399">
        <input type="number" placeholder="0"      value="${r.nonEx}"    oninput="rows[${i}].nonEx=this.value"    style="color:#fb923c">
        <button class="del-btn" onclick="removeRow(${i})">×</button>
      `;
    }
    c.appendChild(div);
  });
}

function addRow()    { rows.push(blankRow()); renderRows(); }
function removeRow(i){ rows.splice(i,1); renderRows(); }
function clearAll()  { rows=[blankRow()]; renderRows(); refreshCharts(); updateStats(); }
function loadSample(){ rows=SAMPLE.map(r=>({...r})); renderRows(); refreshCharts(); updateStats(); }

function togglePaste() {
  const el = document.getElementById('pasteArea');
  el.style.display = el.style.display==='none' ? '' : 'none';
}

function parsePaste() {
  const text = document.getElementById('pasteText').value.trim();
  if (!text) return toast('붙여넣기 영역이 비어있습니다', 'error');
  const parsed = text.split('\n').filter(l=>l.trim()).map(line => {
    const c = line.split('\t').map(x=>x.trim().replace(/%/g,'').replace(/,/g,''));
    return { name:c[0]||'', open:c[1]||'', high:c[2]||'', time:c[3]||'9:00', existing:c[4]||'', nonEx:c[5]||'' };
  }).filter(r=>r.name);
  if (!parsed.length) return toast('파싱 실패: 탭 구분 형식인지 확인해주세요', 'error');
  rows = parsed;
  renderRows();
  refreshCharts();
  updateStats();
  document.getElementById('pasteText').value = '';
  togglePaste();
  toast(`✅ ${parsed.length}개 종목 불러옴`, 'success');
}

// ════════════════════════════════════════════
//  차트
// ════════════════════════════════════════════
function timeToMin(t) {
  if (!t) return null;
  const [h,m] = t.trim().split(':').map(Number);
  if (isNaN(h)||isNaN(m)) return null;
  return (h-9)*60+m;
}
function minToTime(v) {
  if (v==null) return '-';
  return `${9+Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`;
}

function toggle(key) {
  vis[key] = !vis[key];
  document.getElementById('leg-'+key).classList.toggle('off', !vis[key]);
  refreshCharts();
}

function refreshCharts() {
  const valid  = rows.filter(r=>r.name);
  const labels = valid.map(r=>r.name);
  const tip = {
    backgroundColor:'#1a2235', titleColor:'#f1f5f9', bodyColor:'#94a3b8',
    borderColor:'#1e2d45', borderWidth:1, padding:10, cornerRadius:8
  };

  // 라인
  const lineDS = [];
  if (vis.open) lineDS.push({ label:'시가수익률', data:valid.map(r=>parseFloat(r.open)||0),
    borderColor:'#3b82f6', pointBackgroundColor:'#3b82f6', tension:.3,
    pointRadius:5, pointHoverRadius:8, yAxisID:'yPct', fill:false });
  if (vis.high) lineDS.push({ label:'고가수익률', data:valid.map(r=>parseFloat(r.high)||0),
    borderColor:'#ef4444', pointBackgroundColor:'#ef4444', tension:.3,
    pointRadius:5, pointHoverRadius:8, yAxisID:'yPct', fill:false });
  if (vis.time) lineDS.push({ label:'고가형성시간', data:valid.map(r=>timeToMin(r.time)),
    borderColor:'#a78bfa', pointBackgroundColor:'#a78bfa', tension:.3,
    pointRadius:5, pointHoverRadius:8, yAxisID:'yTime', fill:false });

  if (lineChart) lineChart.destroy();
  lineChart = new Chart(document.getElementById('lineChart'), {
    type:'line', data:{ labels, datasets:lineDS },
    options:{ responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{display:false}, tooltip:tip },
      scales:{
        x:{ grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#94a3b8',font:{family:"'Noto Sans KR'",size:10},maxRotation:45}},
        yPct:{ position:'left', grid:{color:'rgba(255,255,255,.04)'},
          ticks:{color:'#94a3b8', font:{family:"'JetBrains Mono'",size:10}, callback:v=>v+'%'}},
        yTime:{ position:'right', grid:{display:false},
          ticks:{color:'#a78bfa', font:{family:"'JetBrains Mono'",size:10}, callback:v=>minToTime(v)}}
      }}
  });

  // 바
  const barDS = [];
  if (vis.existing) barDS.push({ label:'기존주주 유통가능금액', data:valid.map(r=>parseFloat(r.existing)||0),
    backgroundColor:'rgba(16,185,129,.75)', hoverBackgroundColor:'#34d399', borderRadius:4 });
  if (vis.nonex) barDS.push({ label:'기존주주 제외 유통가능금액', data:valid.map(r=>parseFloat(r.nonEx)||0),
    backgroundColor:'rgba(249,115,22,.75)', hoverBackgroundColor:'#fb923c', borderRadius:4 });

  if (barChart) barChart.destroy();
  barChart = new Chart(document.getElementById('barChart'), {
    type:'bar', data:{ labels, datasets:barDS },
    options:{ responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins:{ legend:{display:false}, tooltip:tip },
      scales:{
        x:{ grid:{color:'rgba(255,255,255,.04)'}, ticks:{color:'#94a3b8',font:{family:"'Noto Sans KR'",size:10},maxRotation:45}},
        y:{ grid:{color:'rgba(255,255,255,.04)'},
          ticks:{color:'#94a3b8', font:{family:"'JetBrains Mono'",size:10},
          callback:v=>v>=1000?(v/1000).toFixed(1)+'k':v}}
      }}
  });
}

// ════════════════════════════════════════════
//  통계
// ════════════════════════════════════════════
function updateStats() {
  const valid = rows.filter(r=>r.name);
  const grid  = document.getElementById('statsGrid');
  if (!valid.length) { grid.innerHTML=''; return; }
  const maxHigh = valid.reduce((a,b)=>parseFloat(a.high)>parseFloat(b.high)?a:b);
  const maxOpen = valid.reduce((a,b)=>parseFloat(a.open)>parseFloat(b.open)?a:b);
  const avgHigh = (valid.reduce((s,r)=>s+(parseFloat(r.high)||0),0)/valid.length).toFixed(1);
  const avgOpen = (valid.reduce((s,r)=>s+(parseFloat(r.open)||0),0)/valid.length).toFixed(1);
  const hit300  = valid.filter(r=>parseFloat(r.high)>=299.9).length;
  grid.innerHTML = [
    {l:'종목 수',          v:valid.length,       c:'#f59e0b'},
    {l:'최고 고가수익률',  v:maxHigh.high+'%',   c:'#ef4444', s:maxHigh.name},
    {l:'최고 시가수익률',  v:maxOpen.open+'%',   c:'#3b82f6', s:maxOpen.name},
    {l:'평균 고가수익률',  v:avgHigh+'%',        c:'#ef4444'},
    {l:'평균 시가수익률',  v:avgOpen+'%',        c:'#3b82f6'},
    {l:'상한가(300%) 도달',v:hit300+'종목',      c:'#f59e0b'},
  ].map(d=>`
    <div class="stat-card">
      <div class="slabel">${d.l}</div>
      <div class="sval" style="color:${d.c}">${d.v}</div>
      ${d.s ? `<div class="ssub">${d.s}</div>` : ''}
    </div>`).join('');
}

// ════════════════════════════════════════════
//  유틸
// ════════════════════════════════════════════
function today() { return new Date().toISOString().slice(0,10); }

function toast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  if (type==='success') {
    el.style.background='#064e3b'; el.style.borderColor='#10b981'; el.style.color='#f1f5f9';
  } else {
    el.style.background='#7f1d1d'; el.style.borderColor='#dc2626'; el.style.color='#f1f5f9';
  }
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>{ el.style.display='none'; }, 3500);
}
</script>
